<!doctype html>
<html lang="pt-br">

<head>

  <title>Livraria</title>
  <link rel="stylesheet" href="./src/assets/css/style.css" />

  <script src="./src/assets/js/app.js" defer></script>

<body id="container">
  <script>
    const header = "./src/components/header.html";

    fetch(header)
      .then((resp) => resp.text())
      .then(
        (data) => (document.getElementById("container").innerHTML += data),
      );

    <section class="lista" id="lista">
      <div class="card-livro">

            <div>

          </div>
          <div class="descri-card">
            <p>Descrição</p>
            <p class="txt-desc">.....</p>

        </div>
        <div class="fun-card">
          <div class="grid-buttons">
            <button type="button" class="button detalhes">Detalhes</button>

          <div>

        </div>
      </div>
