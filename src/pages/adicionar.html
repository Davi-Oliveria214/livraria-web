<!doctype html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Adicionar Livro</title>

        <!-- Css -->
        <link rel="stylesheet" href="/src/assets/css/style.css" />
        <link rel="stylesheet" href="/src/assets/css/pages/adicionar.css" />

        <!-- JavaScript -->
        <script src="/src/assets/js/app.js" defer></script>
        <script
            src="/src/assets/js/modules/adicionar.js"
            type="module"
            defer
        ></script>
    </head>

    <body>
        <script>
            const header = "/src/components/header.html";

            fetch(header)
                .then((resp) => resp.text())
                .then((data) =>
                    document.body.insertAdjacentHTML("afterbegin", data),
                );
        </script>

        <main class="main">
            <img src="" alt="" />
            <section class="box-adicionar">
                <form class="form-livro" id="form-livro">
                    <h1>Adicionar livro</h1>
                    <div class="box-info">
                        <label for="titulo">Titulo</label>
                        <input
                            type="text"
                            name="titulo"
                            id="titulo"
                            placeholder="titulo"
                            required
                        />
                    </div>
                    <div class="box-info">
                        <label for="autor">Autor</label>
                        <input
                            type="text"
                            name="autor"
                            id="autor"
                            placeholder="autor"
                            required
                        />
                    </div>
                    <div class="box-info">
                        <label for="genero">Genêro</label>
                        <select name="genero" id="genero" required>
                            <option value="" selected>Indefinido</option>
                            <option value="ptA04">Ação</option>
                        </select>
                    </div>
                    <div class="box-info">
                        <label for="isbn">ISBN</label>
                        <input
                            type="text"
                            name="isbn"
                            id="isbn"
                            placeholder="ISBN"
                            number
                            required
                        />
                    </div>
                    <div class="box-info">
                        <label for="preco">Preço</label>
                        <input
                            type="number"
                            step="any"
                            min="0"
                            placeholder="0.00"
                            name="preco"
                            id="preco"
                            required
                        />
                    </div>
                    <div class="box-info">
                        <label for="estoque">Estoque</label>
                        <input
                            type="number"
                            min="0"
                            name="estoque"
                            id="estoque"
                            placeholder="0"
                            required
                        />
                    </div>
                    <div class="box-info">
                        <label for="lancamento">Lançamento</label>
                        <input
                            type="date"
                            name="lancamento"
                            id="lancamento"
                            placeholder="lançamento"
                            required
                        />
                    </div>
                    <div class="box-info">
                        <label for="desc">Sinopse</label>
                        <textarea
                            name="sinopse"
                            id="desc"
                            placeholder="Sinopse"
                            required
                        ></textarea>
                    </div>

                    <div class="buttons">
                        <button type="submit" class="button adicionar">
                            Adicionar
                        </button>
                        <button type="button" class="button">Limpar</button>
                    </div>
                </form>
            </section>
        </main>
    </body>
</html>
