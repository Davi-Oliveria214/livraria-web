<!doctype html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Histórico</title>

        <!-- Css -->
        <link rel="stylesheet" href="/src/assets/css/style.css" />
        <link rel="stylesheet" href="/src/assets/css/pages/historico.css" />

        <!-- JavaScript -->
        <script src="/src/assets/js/app.js"></script>
        <script src="/src/assets/js/modules/historico.js" type="module"></script>
    </head>

    <body>
        <script>
            const header = "/src/components/header.html";

            fetch(header)
                .then((resp) => resp.text())
                .then((resp) =>
                    document.body.insertAdjacentHTML("afterbegin", resp),
                );
        </script>

        <main class="historico">
            <section class="his-info box-his">
                <h2>Informações</h2>
                <div class="info-sobre">
                    <p id="qtd-livros"><strong>Livros: </strong>50</p>
                    <p id="qtd-generos"><strong>Gêneros: </strong>20</p>
                    <p id="qtd-autores"><strong>Autores: </strong>10</p>
                </div>
            </section>
            <section class="his-box box-his" id="lista"></section>
        </main>
    </body>
</html>
